<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leads Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Leads</h1>

        <input type="text" id="input-el" placeholder="Paste or type a link">

        <div class="actions">
            <button id="input-btn">Save</button>
            <button id="tab-btn">Save this tab</button>
        </div>

        <ul id="ul-el"></ul>

        <button id="delete-btn">Delete all</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
